<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcade Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: manipulation; 
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input { user-select: auto; -webkit-user-select: auto; }
    html, body {
      width: 100%; margin: 0; padding: 0;
      background-color: #050b14; color: #f8fafc; 
      font-family: 'Press Start 2P', monospace;
      background-image: radial-gradient(#1e293b 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 750px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; }
    .screen.active { display: flex; }
    .arcade-title {
      font-size: 1.8rem; color: #38bdf8;
      text-shadow: 4px 4px 0px #1e293b, 8px 8px 0px #020617;
      text-align: center; margin-bottom: 30px; line-height: 1.6; letter-spacing: 3px;
      border-bottom: 4px dashed #334155; padding-bottom: 20px; width: 100%;
    }
    h1 { font-size: 1.2rem; font-weight: 400; color: #38bdf8; margin: 0 0 15px 0; text-align: center; line-height: 1.5; text-shadow: 3px 3px 0px #000; }
    .login-box {
      background: #0f172a; border: 4px solid #334155; padding: 35px; width: 100%; max-width: 450px;
      display: flex; flex-direction: column; gap: 20px; box-shadow: 8px 8px 0px #000; align-items: center;
    }
    .login-input {
      width: 100%; padding: 16px; font-size: 0.9rem; background: #020617;
      border: 3px solid #475569; color: white; text-align: center; outline: none; font-family: 'Press Start 2P', monospace;
    }
    .login-input:focus { border-color: #38bdf8; }
    .login-btn {
      width: 100%; padding: 16px; font-family: 'Press Start 2P', monospace; font-size: 0.9rem;
      background-color: #38bdf8; color: #0f172a; border: 3px solid #020617; cursor: pointer; box-shadow: 4px 4px 0px #020617;
    }
    .guest-btn {
      width: 100%; padding: 14px; font-family: 'Press Start 2P', monospace; font-size: 0.75rem;
      background-color: transparent; color: #94a3b8; border: 3px solid #475569; cursor: pointer;
    }
    .guest-btn:hover { color: #f8fafc; border-color: #f8fafc; }
    #loginMsg { font-size: 0.7rem; color: #f43f5e; text-align: center; min-height: 20px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; width: 100%; max-width: 600px; margin-bottom: 30px; }
    .game-card {
      background: #0f172a; border: 4px solid #334155; overflow: hidden; cursor: pointer;
      box-shadow: 6px 6px 0px #000; transition: transform 0.1s; display: flex; flex-direction: column; align-items: center; padding-bottom: 18px;
    }
    .game-card:hover { transform: translateY(-4px); border-color: #38bdf8; }
    .game-cover { width: 100%; height: 130px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; background-size: cover; background-position: center; border-bottom: 3px solid #334155; }
    .cover-snake { background-color: #163820; }
    .cover-tiger { background: linear-gradient(135deg, #ff7b54 0%, #2d5a27 100%); }
    .cover-bomber { background: linear-gradient(135deg, #451a03 0%, #7c2d12 100%); }
    
    /* Estilo de tarjeta bloqueada / en desarrollo */
    .game-card.disabled {
      opacity: 0.65;
      cursor: not-allowed;
      border-color: #eab308;
    }
    .game-card.disabled:hover { transform: none; border-color: #eab308; }
    .dev-banner {
      background: repeating-linear-gradient(45deg, #eab308, #eab308 10px, #000 10px, #000 20px);
      color: #fff; font-size: 0.55rem; text-align: center; padding: 6px; width: 100%; font-weight: bold; text-shadow: 1px 1px 0px #000;
    }

    .game-title { font-size: 0.75rem; color: #f8fafc; margin-top: 12px; text-align: center; }
    .main-wrapper { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 600px; align-items: center; }
    .game-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
    canvas { border: 5px solid #334155; background-color: #020617; width: 100%; max-width: 580px; height: auto; aspect-ratio: 1 / 1; image-rendering: pixelated; box-shadow: 8px 8px 0px #000; }
    .dashboard { background: #0f172a; border: 4px solid #334155; padding: 20px; width: 100%; display: flex; gap: 15px; box-shadow: 6px 6px 0px #000; }
    .dashboard h2 { font-size: 0.75rem; font-weight: 400; color: #94a3b8; margin: 0 0 10px 0; text-transform: uppercase; text-align: center; }
    .mobile-controls { display: grid; grid-template-columns: repeat(3, 85px); grid-template-rows: repeat(2, 75px); gap: 12px; margin-top: 20px; justify-content: center; }
    .ctrl-btn { background: #1e293b; border: 3px solid #475569; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 4px 4px 0px #020617; }
    .ctrl-btn:active { background: #38bdf8; color: #0f172a; transform: translate(2px, 2px); box-shadow: none; }
    .btn-up { grid-column: 2; grid-row: 1; } .btn-left { grid-column: 1; grid-row: 2; } .btn-down { grid-column: 2; grid-row: 2; } .btn-right { grid-column: 3; grid-row: 2; }
    .back-btn { background: transparent; color: #94a3b8; border: 3px solid #475569; font-family: 'Press Start 2P', monospace; font-size: 0.75rem; padding: 14px 20px; cursor: pointer; margin-bottom: 10px; align-self: flex-start; box-shadow: 3px 3px 0px #000; }
    .back-btn:hover { color: #f8fafc; border-color: #f8fafc; background: #1e293b; }
    .score-table { width: 100%; border-collapse: collapse; font-size: 0.65rem; }
    .score-table th, .score-table td { padding: 8px 4px; text-align: left; border-bottom: 2px dashed #1e293b; }
    .score-table th { color: #38bdf8; }
  </style>
</head>
<body>

  <!-- LOGIN LOCAL -->
  <div id="vistaLogin" class="screen">
    <div style="margin-bottom: 25px; text-align: center; width: 100%;">
      <div class="arcade-title">ARCADE HUB</div>
      <p style="color: #94a3b8; margin: 0; font-size: 0.7rem; line-height: 1.8;">INGRESA UN NOMBRE PARA GUARDAR RÉCORDS</p>
    </div>
    <div class="login-box">
      <input type="text" id="userInput" class="login-input" placeholder="TU NOMBRE" maxlength="12">
      <div id="loginMsg"></div>
      <button class="login-btn" onclick="intentarLogin()">JUGAR AHORA</button>
      <button class="guest-btn" onclick="jugarComoInvitado()">JUGAR COMO INVITADO</button>
    </div>
  </div>

  <!-- MENÚ PRINCIPAL -->
  <div id="menuPrincipal" class="screen">
    <div style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px;">
      <div class="arcade-title">ARCADE HUB</div>
      <p id="welcomeUser" style="color: #38bdf8; font-size: 0.8rem; margin-top: 0; margin-bottom: 30px; text-align:center;"></p>
      
      <div class="menu-grid">
        <div class="game-card" onclick="cambiarPantalla('vistaCulebrita')">
          <div class="game-cover cover-snake">🐍</div>
          <div class="game-title">CULEBRITA</div>
        </div>
        <div class="game-card" onclick="cambiarPantalla('vistaTigre')">
          <div class="game-cover cover-tiger">🐅</div>
          <div class="game-title">TIGRE</div>
        </div>
        <div class="game-card" onclick="cambiarPantalla('vistaBomber')">
          <div class="game-cover cover-bomber">💣</div>
          <div class="game-title">BOMBER</div>
        </div>
        <!-- Tarjeta bloqueada en desarrollo -->
        <div class="game-card disabled" onclick="alert('¡Juego en construcción! Vuelve pronto.')">
          <div class="dev-banner">EN DESARROLLO</div>
          <div class="game-cover" style="background: linear-gradient(135deg, #334155 0%, #0f172a 100%);">🚧</div>
          <div class="game-title">KONG ARCADE</div>
        </div>
      </div>

      <button onclick="cerrarSesion()" class="back-btn" style="width: 100%; text-align: center; margin-top: 15px; justify-content: center; display: flex;" id="btnSalirSesion">CAMBIAR JUGADOR</button>
    </div>
  </div>

  <!-- CULEBRITA -->
  <div id="vistaCulebrita" class="screen">
    <div class="main-wrapper">
      <button class="back-btn" onclick="cambiarPantalla('menuPrincipal')">← MENÚ</button>
      <div class="game-container">
        <h1 style="font-size: 1.1rem; margin-bottom: 10px;">CULEBRITA</h1>
        <p style="color: #38bdf8; font-size: 0.9rem; margin: 0 0 18px 0;">PTS: <span id="scoreCulebra">0</span></p>
        <canvas id="gameCanvasCulebra" width="300" height="300"></canvas>
        <button id="respawnBtnCulebra" onclick="resetCulebra()" style="display:none; font-family:'Press Start 2P'; font-size:0.8rem; background:#38bdf8; color:#0f172a; padding:14px 28px; border:3px solid #000; margin-top:18px; cursor:pointer;">REINTENTAR</button>
        <div class="mobile-controls">
          <button class="ctrl-btn btn-up" ontouchstart="intentarMoverC(0, -20); event.preventDefault();" onclick="intentarMoverC(0, -20)">▲</button>
          <button class="ctrl-btn btn-left" ontouchstart="intentarMoverC(-20, 0); event.preventDefault();" onclick="intentarMoverC(-20, 0)">◄</button>
          <button class="ctrl-btn btn-down" ontouchstart="intentarMoverC(0, 20); event.preventDefault();" onclick="intentarMoverC(0, 20)">▼</button>
          <button class="ctrl-btn btn-right" ontouchstart="intentarMoverC(20, 0); event.preventDefault();" onclick="intentarMoverC(20, 0)">►</button>
        </div>
      </div>
      <div class="dashboard">
        <div style="flex: 1;">
          <h2>TOP LOCAL</h2>
          <table id="scoreTableCulebra" class="score-table"><tr><th>JUGADOR</th><th>PTS</th></tr></table>
        </div>
      </div>
    </div>
  </div>

  <!-- TIGRE EN LA SELVA -->
  <div id="vistaTigre" class="screen">
    <div class="main-wrapper">
      <button class="back-btn" onclick="cambiarPantalla('menuPrincipal')">← MENÚ</button>
      <div class="game-container">
        <h1 style="font-size: 1.1rem; margin-bottom: 10px;">TIGRE SELVA</h1>
        <p style="color: #38bdf8; font-size: 0.9rem; margin: 0 0 18px 0;">PTS: <span id="scoreTigre">0</span></p>
        <canvas id="gameCanvasTigre" width="300" height="300" style="cursor:pointer;" onclick="saltarTigre()"></canvas>
        <button id="respawnBtnTigre" onclick="resetTigre()" style="display:none; font-family:'Press Start 2P'; font-size:0.8rem; background:#38bdf8; color:#0f172a; padding:14px 28px; border:3px solid #000; margin-top:18px; cursor:pointer;">SALTAR OTRA VEZ</button>
        <p style="font-size:0.7rem; color:#94a3b8; margin-top:12px; text-align:center;">TOCA PANTALLA O ESPACIO</p>
      </div>
      <div class="dashboard">
        <div style="flex: 1;">
          <h2>TOP LOCAL</h2>
          <table id="scoreTableTigre" class="score-table"><tr><th>JUGADOR</th><th>PTS</th></tr></table>
        </div>
      </div>
    </div>
  </div>

  <!-- BOMBER MAN -->
  <div id="vistaBomber" class="screen">
    <div class="main-wrapper">
      <button class="back-btn" onclick="cambiarPantalla('menuPrincipal')">← MENÚ</button>
      <div class="game-container">
        <h1 style="font-size: 1.1rem; margin-bottom: 10px;">BOMBER MAN</h1>
        <p style="color: #38bdf8; font-size: 0.8rem; margin: 0 0 18px 0;">NIVEL <span id="nivelBomber">1</span> | PTS: <span id="scoreBomber">0</span></p>
        <canvas id="gameCanvasBomber" width="300" height="300"></canvas>
        <button id="respawnBtnBomber" onclick="resetBomber()" style="display:none; font-family:'Press Start 2P'; font-size:0.8rem; background:#38bdf8; color:#0f172a; padding:14px 28px; border:3px solid #000; margin-top:18px; cursor:pointer;">¡JUGAR DE NUEVO!</button>
        <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
          <div class="mobile-controls" style="margin-top:15px;">
            <button class="ctrl-btn btn-up" ontouchstart="moverBomber(0, -1); event.preventDefault();" onclick="moverBomber(0, -1)">▲</button>
            <button class="ctrl-btn btn-left" ontouchstart="moverBomber(-1, 0); event.preventDefault();" onclick="moverBomber(-1, 0)">◄</button>
            <button class="ctrl-btn btn-down" ontouchstart="moverBomber(0, 1); event.preventDefault();" onclick="moverBomber(0, 1)">▼</button>
            <button class="ctrl-btn btn-right" ontouchstart="moverBomber(1, 0); event.preventDefault();" onclick="moverBomber(1, 0)">►</button>
          </div>
          <button onclick="ponerBomba()" style="margin-top:18px; width:100%; max-width:275px; background:#ef4444; color:white; border:3px solid #000; padding:16px; font-family:'Press Start 2P'; font-size:0.8rem; cursor:pointer;">💣 BOMBA</button>
        </div>
      </div>
      <div class="dashboard">
        <div style="flex: 1;">
          <h2>TOP LOCAL</h2>
          <table id="scoreTableBomber" class="score-table"><tr><th>JUGADOR</th><th>PTS</th></tr></table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let usuarioActual = "";
    let animIdCulebra = null;
    let animIdTigre = null;
    let animIdBomber = null;
    let juegoCulebraActivo = false;
    let juegoTigreActivo = false;
    let juegoBomberActivo = false;

    let audioCtx = null;
    let currentMusicInterval = null;

    function initAudio() {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    }

    document.addEventListener('pointerdown', () => {
      initAudio();
      if (!currentMusicInterval && document.getElementById('menuPrincipal').classList.contains('active')) {
        startMenuMusic();
      }
    }, { once: true });

    function playTone(freq, duration, type = 'square', delay = 0) {
      initAudio();
      setTimeout(() => {
        if (!audioCtx || audioCtx.state !== 'running') return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }, delay);
    }

    function playSlide(startFreq, endFreq, duration, type = 'square') {
      initAudio();
      if (!audioCtx || audioCtx.state !== 'running') return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playNoise(duration) {
      initAudio();
      if (!audioCtx || audioCtx.state !== 'running') return;
      let bufferSize = audioCtx.sampleRate * duration;
      let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      let data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
      let noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      let filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, audioCtx.currentTime);
      filter.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + duration);
      let gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function stopMusic() {
      if (currentMusicInterval) { clearInterval(currentMusicInterval); currentMusicInterval = null; }
    }

    function startMenuMusic() {
      stopMusic();
      let notes = [330, 392, 523, 659, 523, 392, 330, 261, 293, 349, 440, 523, 440, 349, 392, 330];
      let index = 0;
      currentMusicInterval = setInterval(() => {
        if (document.getElementById('menuPrincipal').classList.contains('active')) {
          playTone(notes[index], 0.18, 'square');
          index = (index + 1) % notes.length;
        }
      }, 200);
    }

    function startCulebraMusic() {
      stopMusic();
      let notes = [164.81, 196.00, 220.00, 246.94, 220.00, 196.00, 164.81, 130.81, 146.83, 174.61, 196.00, 220.00, 196.00, 174.61, 146.83, 123.47];
      let index = 0;
      currentMusicInterval = setInterval(() => {
        if (juegoCulebraActivo) {
          playTone(notes[index], 0.14, 'triangle');
          index = (index + 1) % notes.length;
        }
      }, 180);
    }

    function startTigerMusic() {
      stopMusic();
      let notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 523.25, 587.33, 523.25, 440.00, 349.23, 329.63, 293.66];
      let index = 0;
      currentMusicInterval = setInterval(() => {
        if (juegoTigreActivo) {
          playTone(notes[index], 0.1, 'sawtooth');
          index = (index + 1) % notes.length;
        }
      }, 140);
    }

    function startBomberMusic() {
      stopMusic();
      let notes = [110.00, 110.00, 130.81, 146.83, 130.81, 110.00, 98.00, 110.00, 123.47, 146.83, 164.81, 146.83, 130.81, 123.47, 110.00, 92.50];
      let index = 0;
      currentMusicInterval = setInterval(() => {
        if (juegoBomberActivo) {
          playTone(notes[index], 0.12, 'square');
          index = (index + 1) % notes.length;
        }
      }, 190);
    }

    function soundCulebraEat() {
      playTone(523.25, 0.08, 'square', 0);
      playTone(659.25, 0.08, 'square', 80);
      playTone(783.99, 0.12, 'square', 160);
    }
    function soundCulebraCrash() { playNoise(0.3); playTone(150, 0.2, 'sawtooth', 0); }
    function soundTigreJump() { playSlide(200, 500, 0.1, 'square'); }
    function soundBomberExplosion() { playNoise(0.4); playTone(100, 0.3, 'sawtooth', 0); }
    function soundBomberLose() { playSlide(400, 100, 0.4, 'sawtooth'); }

    window.onload = function() {
      let savedUser = localStorage.getItem('arcadeUser');
      if (savedUser) {
        usuarioActual = savedUser;
        document.getElementById('welcomeUser').innerText = "HOLA, " + usuarioActual;
        document.getElementById('btnSalirSesion').innerText = "CAMBIAR JUGADOR";
        cambiarPantalla('menuPrincipal');
      } else {
        usuarioActual = "";
        document.getElementById('welcomeUser').innerText = "MODO INVITADO";
        document.getElementById('btnSalirSesion').innerText = "PONER MI NOMBRE";
        cambiarPantalla('vistaLogin');
      }
    };

    function intentarLogin() {
      initAudio();
      let u = document.getElementById('userInput').value.trim();
      let msg = document.getElementById('loginMsg');
      if (!u) { msg.innerText = "POR FAVOR, INGRESA UN NOMBRE"; return; }
      usuarioActual = u;
      localStorage.setItem('arcadeUser', usuarioActual);
      document.getElementById('welcomeUser').innerText = "HOLA, " + usuarioActual;
      document.getElementById('btnSalirSesion').innerText = "CAMBIAR JUGADOR";
      cambiarPantalla('menuPrincipal');
    }

    function jugarComoInvitado() {
      initAudio();
      usuarioActual = "";
      localStorage.removeItem('arcadeUser');
      document.getElementById('welcomeUser').innerText = "MODO INVITADO";
      document.getElementById('btnSalirSesion').innerText = "PONER MI NOMBRE";
      cambiarPantalla('menuPrincipal');
    }

    function cerrarSesion() {
      localStorage.removeItem('arcadeUser');
      usuarioActual = "";
      document.getElementById('userInput').value = "";
      document.getElementById('loginMsg').innerText = "";
      cambiarPantalla('vistaLogin');
    }

    function cambiarPantalla(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      juegoCulebraActivo = false; juegoTigreActivo = false; juegoBomberActivo = false;
      if (animIdCulebra) cancelAnimationFrame(animIdCulebra);
      if (animIdTigre) cancelAnimationFrame(animIdTigre);
      if (animIdBomber) cancelAnimationFrame(animIdBomber);
      stopMusic();
      if(id === 'menuPrincipal') { startMenuMusic(); }
      if(id === 'vistaCulebrita') { cargarTablaRécordsGenerica("Culebrita"); iniciarCulebra(); }
      if(id === 'vistaTigre') { cargarTablaRécordsGenerica("TigreSelva"); iniciarTigre(); }
      if(id === 'vistaBomber') { cargarTablaRécordsGenerica("BomberMan"); iniciarBomber(); }
      window.scrollTo(0, 0);
    }

    function guardarPuntajeAutomatico(juego, puntaje) {
      if (!usuarioActual) return;
      let scores = JSON.parse(localStorage.getItem('arcadeScores')) || [];
      let indexExistente = scores.findIndex(item => item.game === juego && item.name === usuarioActual);
      if (indexExistente !== -1) {
        if (puntaje > scores[indexExistente].score) { scores[indexExistente].score = puntaje; }
      } else {
        scores.push({ name: usuarioActual, score: puntaje, game: juego });
      }
      scores.sort((a, b) => b.score - a.score);
      localStorage.setItem('arcadeScores', JSON.stringify(scores));
      cargarTablaRécordsGenerica(juego);
    }

    function cargarTablaRécordsGenerica(nombreJuego) {
      let tablaId = "scoreTableCulebra";
      if (nombreJuego === "TigreSelva") tablaId = "scoreTableTigre";
      if (nombreJuego === "BomberMan") tablaId = "scoreTableBomber";
      let scoreTable = document.getElementById(tablaId);
      if (!scoreTable) return;
      scoreTable.innerHTML = "<tr><th>JUGADOR</th><th>PTS</th></tr>";
      let scores = JSON.parse(localStorage.getItem('arcadeScores')) || [];
      let filtered = scores.filter(item => item.game === nombreJuego).slice(0, 5);
      if(filtered.length === 0) {
        scoreTable.innerHTML += "<tr><td colspan='2' style='text-align:center; color:#64748b;'>SIN RÉCORDS</td></tr>";
        return;
      }
      filtered.forEach(function(item) {
        let rowStyle = item.name === usuarioActual && usuarioActual !== "" ? "color: #38bdf8;" : "";
        scoreTable.innerHTML += `<tr style="${rowStyle}"><td>${item.name}</td><td>${item.score}</td></tr>`;
      });
    }

    // --- CULEBRITA & TIGRE & BOMBER (Mantenidos igual) ---
    const canvasC = document.getElementById('gameCanvasCulebra');
    const ctxC = canvasC.getContext('2d');
    let snake = [{x: 140, y: 140}], food = {x: 100, y: 100};
    let dxC = 20, dyC = 0, scoreC = 0, gameOverC = false;
    let lastTimeC = 0, acumuladorC = 0, cambiandoDirC = false;

    function iniciarCulebra() {
      if (animIdCulebra) cancelAnimationFrame(animIdCulebra);
      snake = [{x: 140, y: 140}]; dxC = 20; dyC = 0; scoreC = 0;
      document.getElementById('scoreCulebra').innerText = scoreC;
      gameOverC = false; lastTimeC = 0; acumuladorC = 0;
      document.getElementById('respawnBtnCulebra').style.display = 'none';
      placeFoodC(); juegoCulebraActivo = true; startCulebraMusic();
      animIdCulebra = requestAnimationFrame(updateCulebra);
    }
    function placeFoodC() {
      food.x = Math.floor(Math.random() * (canvasC.width / 20)) * 20;
      food.y = Math.floor(Math.random() * (canvasC.height / 20)) * 20;
    }
    function updateCulebra(time) {
      if (!juegoCulebraActivo || gameOverC) return;
      animIdCulebra = requestAnimationFrame(updateCulebra);
      if (!lastTimeC) lastTimeC = time;
      acumuladorC += (time - lastTimeC); lastTimeC = time;
      let currentSnakeSpeed = scoreC >= 500 ? 65 : (scoreC >= 100 ? 90 : 110);
      while (acumuladorC >= currentSnakeSpeed) {
        acumuladorC -= currentSnakeSpeed; cambiandoDirC = false;
        const head = {x: snake[0].x + dxC, y: snake[0].y + dyC};
        if (head.x < 0 || head.x >= canvasC.width || head.y < 0 || head.y >= canvasC.height || snake.some(p => p.x === head.x && p.y === head.y)) {
          gameOverC = true; juegoCulebraActivo = false; stopMusic(); soundCulebraCrash();
          document.getElementById('respawnBtnCulebra').style.display = 'block';
          if (scoreC > 0) guardarPuntajeAutomatico("Culebrita", scoreC);
          return;
        }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          scoreC += 10; soundCulebraEat();
          document.getElementById('scoreCulebra').innerText = scoreC; placeFoodC();
        } else { snake.pop(); }
      }
      ctxC.clearRect(0, 0, canvasC.width, canvasC.height);
      for (let r = 0; r < canvasC.height / 20; r++) {
        for (let c = 0; c < canvasC.width / 20; c++) {
          ctxC.fillStyle = (r + c) % 2 === 0 ? '#1b431b' : '#225222';
          ctxC.fillRect(c * 20, r * 20, 20, 20);
        }
      }
      ctxC.fillStyle = '#ff2a2a'; ctxC.fillRect(food.x + 3, food.y + 6, 14, 10);
      ctxC.fillStyle = '#55ff55'; ctxC.fillRect(food.x + 8, food.y + 2, 4, 4);
      snake.forEach((p, index) => {
        ctxC.fillStyle = index === 0 ? '#00ccff' : '#0099cc';
        ctxC.fillRect(p.x + 1, p.y + 1, 18, 18);
      });
    }
    function intentarMoverC(nx, ny) {
      if (gameOverC || cambiandoDirC) return;
      if (ny !== 0 && dyC === 0) { dxC = 0; dyC = ny; cambiandoDirC = true; }
      else if (nx !== 0 && dxC === 0) { dxC = nx; dyC = 0; cambiandoDirC = true; }
    }
    function resetCulebra() { iniciarCulebra(); }

    const canvasT = document.getElementById('gameCanvasTigre');
    const ctxT = canvasT.getContext('2d');
    let tigre = { x: 40, y: 220, w: 32, h: 24, vy: 0, jump: -9.5, gravity: 0.5, grounded: true };
    let obstaculos = [], distance = 0, scoreT = 0, gameOverT = false, nextSpawn = 0;
    function iniciarTigre() {
      if (animIdTigre) cancelAnimationFrame(animIdTigre);
      tigre.y = 220; tigre.vy = 0; tigre.grounded = true; obstaculos = []; distance = 0; scoreT = 0;
      nextSpawn = 40 + Math.floor(Math.random() * 100);
      document.getElementById('scoreTigre').innerText = scoreT;
      gameOverT = false; document.getElementById('respawnBtnTigre').style.display = 'none';
      juegoTigreActivo = true; startTigerMusic();
      animIdTigre = requestAnimationFrame(updateTigre);
    }
    function saltarTigre() {
      if (tigre.grounded && juegoTigreActivo && !gameOverT) {
        tigre.vy = tigre.jump; tigre.grounded = false; soundTigreJump();
      }
    }
    function updateTigre() {
      if (!juegoTigreActivo || gameOverT) return;
      animIdTigre = requestAnimationFrame(updateTigre);
      let currentSpeed = scoreT >= 1000 ? 7 : (scoreT >= 400 ? 6 : 4.5);
      distance += currentSpeed; scoreT = Math.floor(distance / 10);
      document.getElementById('scoreTigre').innerText = scoreT;
      tigre.vy += tigre.gravity; tigre.y += tigre.vy;
      if (tigre.y >= 220) { tigre.y = 220; tigre.vy = 0; tigre.grounded = true; }
      nextSpawn--;
      if (nextSpawn <= 0) {
        let esLoro = scoreT >= 1000 && Math.random() > 0.55;
        if (esLoro) {
          obstaculos.push({ x: 300, y: (Math.random() > 0.5 ? 185 : 215), w: 24, h: 12, tipo: 'loro', sonado: false });
        } else {
          obstaculos.push({ x: 300, y: 228, w: 16, h: 16, tipo: 'tronco' });
        }
        nextSpawn = 35 + Math.floor(Math.random() * 100);
      }
      for (let i = obstaculos.length - 1; i >= 0; i--) {
        obstaculos[i].x -= currentSpeed;
        if (
          tigre.x < obstaculos[i].x + obstaculos[i].w &&
          tigre.x + tigre.w > obstaculos[i].x &&
          tigre.y < obstaculos[i].y + obstaculos[i].h &&
          tigre.y + tigre.h > obstaculos[i].y
        ) {
          gameOverT = true; juegoTigreActivo = false; stopMusic(); soundCulebraCrash();
          document.getElementById('respawnBtnTigre').style.display = 'block';
          if (scoreT > 0) guardarPuntajeAutomatico("TigreSelva", scoreT);
          return;
        }
        if (obstaculos[i].x + obstaculos[i].w < 0) obstaculos.splice(i, 1);
      }
      ctxT.clearRect(0, 0, canvasT.width, canvasT.height);
      ctxT.fillStyle = '#ff7b54'; ctxT.fillRect(0, 0, canvasT.width, canvasT.height);
      ctxT.fillStyle = '#1b431b'; ctxT.fillRect(0, 244, canvasT.width, 56);
      obstaculos.forEach(o => {
        ctxT.fillStyle = o.tipo === 'loro' ? '#ef4444' : '#5c4033';
        ctxT.fillRect(o.x, o.y, o.w, o.h);
      });
      ctxT.fillStyle = '#f97316'; ctxT.fillRect(tigre.x, tigre.y, tigre.w, tigre.h);
    }
    function resetTigre() { iniciarTigre(); }

    const canvasB = document.getElementById('gameCanvasBomber');
    const ctxB = canvasB.getContext('2d');
    const colsB = 11, rowsB = 11;
    let mapB = [], playerB = { x: 1, y: 1, dir: 'down' }, bombasB = [], explosionesB = [], enemigosB = [];
    let scoreBomber = 0, nivelBomber = 1, gameOverBomber = false, tiempoRecargaBomba = 0;
    function iniciarBomber(siguienteNivel = false) {
      if (animIdBomber) cancelAnimationFrame(animIdBomber);
      if (!siguienteNivel) { scoreBomber = 0; nivelBomber = 1; }
      document.getElementById('scoreBomber').innerText = scoreBomber;
      document.getElementById('nivelBomber').innerText = nivelBomber;
      gameOverBomber = false; document.getElementById('respawnBtnBomber').style.display = 'none';
      playerB = { x: 1, y: 1, dir: 'down' }; bombasB = []; explosionesB = []; tiempoRecargaBomba = 0;
      mapB = [];
      for (let r = 0; r < rowsB; r++) {
        let row = [];
        for (let c = 0; c < colsB; c++) {
          if (r === 0 || r === rowsB - 1 || c === 0 || c === colsB - 1 || (r % 2 === 0 && c % 2 === 0)) {
            row.push(1);
          } else if ((r === 1 && c === 1) || (r === 1 && c === 2) || (r === 2 && c === 1)) {
            row.push(0);
          } else { row.push(Math.random() < 0.6 ? 2 : 0); }
        }
        mapB.push(row);
      }
      juegoBomberActivo = true; startBomberMusic();
      animIdBomber = requestAnimationFrame(updateBomber);
    }
    function moverBomber(dx, dy) {
      if (!juegoBomberActivo || gameOverBomber) return;
      let nx = playerB.x + dx, ny = playerB.y + dy;
      if (nx >= 0 && nx < colsB && ny >= 0 && ny < rowsB && mapB[ny][nx] === 0) {
        playerB.x = nx; playerB.y = ny;
      }
    }
    function ponerBomba() {
      if (!juegoBomberActivo || gameOverBomber || tiempoRecargaBomba > 0) return;
      bombasB.push({ x: playerB.x, y: playerB.y, timer: 120, alcance: 2 });
      tiempoRecargaBomba = 180;
    }
    function updateBomber() {
      if (!juegoBomberActivo || gameOverBomber) return;
      animIdBomber = requestAnimationFrame(updateBomber);
      if (tiempoRecargaBomba > 0) tiempoRecargaBomba--;
      for (let i = bombasB.length - 1; i >= 0; i--) {
        bombasB[i].timer--;
        if (bombasB[i].timer <= 0) {
          bombasB.splice(i, 1); soundBomberExplosion();
        }
      }
      ctxB.clearRect(0, 0, canvasB.width, canvasB.height);
      let cellW = canvasB.width / colsB, cellH = canvasB.height / rowsB;
      for (let r = 0; r < rowsB; r++) {
        for (let c = 0; c < colsB; c++) {
          ctxB.fillStyle = mapB[r][c] === 1 ? '#475569' : (mapB[r][c] === 2 ? '#9a3412' : '#1e293b');
          ctxB.fillRect(c * cellW, r * cellH, cellW, cellH);
        }
      }
      ctxB.fillStyle = '#3b82f6';
      ctxB.fillRect(playerB.x * cellW + 4, playerB.y * cellH + 4, cellW - 8, cellH - 8);
    }
    function resetBomber() { iniciarBomber(false); }

    document.addEventListener('keydown', (e) => {
      if (["Space", " ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
      if (document.getElementById('vistaCulebrita').classList.contains('active')) {
        if (gameOverC && (e.key === ' ' || e.code === 'Space')) return resetCulebra();
        if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') intentarMoverC(0, -20);
        if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') intentarMoverC(0, 20);
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') intentarMoverC(-20, 0);
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') intentarMoverC(20, 0);
      }
      if (document.getElementById('vistaTigre').classList.contains('active')) {
        if (e.key === ' ' || e.code === 'Space' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
          gameOverT ? resetTigre() : saltarTigre();
        }
      }
      if (document.getElementById('vistaBomber').classList.contains('active')) {
        if (gameOverBomber && (e.key === ' ' || e.code === 'Space')) return resetBomber();
        if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') moverBomber(0, -1);
        if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') moverBomber(0, 1);
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') moverBomber(-1, 0);
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') moverBomber(1, 0);
        if (e.key === ' ' || e.code === 'Space') ponerBomba();
      }
    });
  </script>
</body>
</html>
