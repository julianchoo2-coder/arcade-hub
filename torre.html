<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre Arcade | Arcade Hub</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#23305a,#0a1025 70%);color:#eaf3ff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(100%,770px);text-align:center}h1{letter-spacing:.14em;color:#facc15;text-shadow:3px 3px #9a3412;margin:12px 0}
a{color:#7dd3fc}.hud{display:flex;align-items:center;justify-content:space-around;gap:8px;flex-wrap:wrap;margin:12px 0;font-weight:800}
canvas{width:100%;height:auto;display:block;background:#111b37;border:4px solid #38bdf8;border-radius:12px;image-rendering:pixelated}
.controls{display:flex;justify-content:center;gap:12px;margin:15px 0;touch-action:none}.controls button, #restart{background:#1e40af;color:white;border:2px solid #60a5fa;border-radius:10px;padding:13px 20px;font-size:18px;font-weight:800;cursor:pointer;touch-action:none}
.controls button:active{background:#0891b2}.note{color:#a8b8d6;font-size:14px}#message{min-height:24px;color:#facc15;font-weight:800}
</style>
</head>
<body>
<main>
<a href="index.html">← Volver a Arcade Hub</a>
<h1>🦍 TORRE ARCADE</h1>
<div class="hud"><span>PUNTOS: <b id="score">0</b></span><span>VIDAS: <b id="lives">3</b></span><span>RÉCORD: <b id="best">0</b></span></div>
<canvas id="game" width="640" height="480" aria-label="Juego de plataformas Torre Arcade"></canvas>
<p id="message" role="status">¡Sube las escaleras y alcanza la bandera!</p>
<div class="controls"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowRight">▶</button><button data-key="Space">SALTAR</button></div>
<button id="restart">REINICIAR PARTIDA</button>
<p class="note">Teclado: ← → para moverte, ↑ ↓ en escaleras, ESPACIO para saltar. Evita los barriles.</p>
</main>
<script>
(() => {
  'use strict';
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives');
  const bestEl=document.getElementById('best'),messageEl=document.getElementById('message');
  const W=640,H=480,ground=456,gravity=.52,speed=2.8,jump=-9.5;
  const floors=[
    {x:18,y:456,w:604},{x:62,y:365,w:560},{x:18,y:274,w:560},
    {x:62,y:183,w:560},{x:18,y:92,w:560}
  ];
  const ladders=[
    {x:540,top:365,bottom:456},{x:90,top:274,bottom:365},
    {x:540,top:183,bottom:274},{x:90,top:92,bottom:183}
  ];
  const keys=new Set();
  let hero,barrels,score,lives,best,spawnClock,status,invuln,last=0;
  try{best=Number(localStorage.getItem('arcadeHubTorreBest'))||0}catch{best=0}
  bestEl.textContent=best;

  function freshHero(){hero={x:40,y:ground-28,w:20,h:28,vx:0,vy:0,onGround:true,climbing:false};invuln=80}
  function reset(){
    score=0;lives=3;barrels=[];spawnClock=0;status='playing';freshHero();
    messageEl.textContent='¡Sube las escaleras y alcanza la bandera!';sync()
  }
  function sync(){scoreEl.textContent=score;livesEl.textContent=lives;bestEl.textContent=best}
  function addScore(value){
    score+=value;
    if(score>best){best=score;try{localStorage.setItem('arcadeHubTorreBest',String(best))}catch{}}
    sync()
  }
  function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
  function takeHit(){
    if(invuln>0||status!=='playing')return;
    lives--;barrels=[];freshHero();sync();
    if(lives===0){status='lost';messageEl.textContent='¡Sin vidas! Reinicia para volver a jugar.'}
    else messageEl.textContent='¡Cuidado con los barriles!'
  }
  function update(){
    if(status!=='playing')return;
    if(invuln>0)invuln--;
    hero.vx=(keys.has('ArrowRight')||keys.has('KeyD')?speed:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?speed:0);
    const near=ladders.find(l=>hero.x+hero.w>l.x-8&&hero.x<l.x+28&&hero.y+hero.h>l.top-6&&hero.y<l.bottom+6);
    const up=keys.has('ArrowUp')||keys.has('KeyW'),down=keys.has('ArrowDown')||keys.has('KeyS');
    if(near&&(up||down))hero.climbing=true;
    if(hero.climbing&&near){
      hero.vy=up?-2.4:down?2.4:0;
      hero.x+=(near.x-hero.x)*.18;
      hero.y+=hero.vy;
      hero.onGround=false;
      if(hero.y+hero.h<near.top-4||hero.y>near.bottom+2)hero.climbing=false;
    }else{
      hero.climbing=false;
      hero.vy=Math.min(hero.vy+gravity,12);
      const previousBottom=hero.y+hero.h;
      hero.y+=hero.vy;
      hero.onGround=false;
      if(hero.vy>=0)for(const f of floors){
        if(hero.x+hero.w>f.x&&hero.x<f.x+f.w&&previousBottom<=f.y+7&&hero.y+hero.h>=f.y){
          hero.y=f.y-hero.h;hero.vy=0;hero.onGround=true;break;
        }
      }
    }
    hero.x=Math.max(0,Math.min(W-hero.w,hero.x+hero.vx));
    if(hero.y>H+30)takeHit();
    spawnClock++;
    if(spawnClock>=115){
      barrels.push({x:550,y:74,r:10,vx:-1.65,vy:0});spawnClock=0;
    }
    for(const b of barrels){
      const prev=b.y+b.r;b.vy=Math.min(b.vy+gravity*.7,9);b.x+=b.vx;b.y+=b.vy;
      for(let i=floors.length-1;i>=0;i--){
        const f=floors[i];
        if(b.x+b.r>f.x&&b.x-b.r<f.x+f.w&&prev<=f.y+4&&b.y+b.r>=f.y){
          b.y=f.y-b.r;b.vy=0;b.vx=i%2===0?-1.65:1.65;break;
        }
      }
      if(overlap(hero,{x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2}))takeHit();
    }
    barrels=barrels.filter(b=>b.x>-25&&b.x<W+25&&b.y<H+25);
    if(hero.y<65&&hero.x>495){
      status='won';addScore(500);messageEl.textContent='🏆 ¡TORRE CONQUISTADA! +500 puntos. ¡Ganaste!'
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#0c1531';ctx.fillRect(0,0,W,H);
    for(let i=0;i<30;i++){ctx.fillStyle=i%2?'#253a70':'#40568e';ctx.fillRect((i*173)%W,(i*83)%H,2,2)}
    floors.forEach((f,i)=>{
      ctx.fillStyle=i%2?'#f97316':'#ef4444';ctx.fillRect(f.x,f.y,f.w,12);
      ctx.fillStyle='#7c2d12';for(let x=f.x+14;x<f.x+f.w;x+=36)ctx.fillRect(x,f.y+3,14,3)
    });
    ladders.forEach(l=>{
      ctx.strokeStyle='#facc15';ctx.lineWidth=5;ctx.beginPath();
      ctx.moveTo(l.x,l.top);ctx.lineTo(l.x,l.bottom);ctx.moveTo(l.x+20,l.top);ctx.lineTo(l.x+20,l.bottom);ctx.stroke();
      ctx.lineWidth=3;for(let y=l.top+8;y<l.bottom;y+=13){ctx.beginPath();ctx.moveTo(l.x,y);ctx.lineTo(l.x+20,y);ctx.stroke()}
    });
    ctx.fillStyle='#22c55e';ctx.fillRect(550,45,5,46);
    ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(555,45);ctx.lineTo(597,55);ctx.lineTo(555,66);ctx.fill();
    ctx.fillStyle='#7042a4';ctx.fillRect(34,40,36,40);
    ctx.fillStyle='#e5e7eb';ctx.fillRect(40,47,10,8);ctx.fillRect(55,47,10,8);
    barrels.forEach(b=>{
      ctx.fillStyle='#a16207';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.stroke()
    });
    if(invuln===0||Math.floor(invuln/6)%2===0){
      ctx.fillStyle='#38bdf8';ctx.fillRect(hero.x,hero.y+9,hero.w,hero.h-9);
      ctx.fillStyle='#fcd34d';ctx.fillRect(hero.x+3,hero.y+2,14,12);
      ctx.fillStyle='#1e3a8a';ctx.fillRect(hero.x+2,hero.y,16,5);
    }
    if(status!=='playing'){
      ctx.fillStyle='#030712bb';ctx.fillRect(95,180,450,90);
      ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.textAlign='center';
      ctx.fillText(status==='won'?'¡GANASTE!':'FIN DEL JUEGO',320,234)
    }
  }
  function frame(t){
    const delta=Math.min(t-last,50);last=t;
    accumulator+=delta;
    while(accumulator>=1000/60){update();accumulator-=1000/60}
    draw();requestAnimationFrame(frame)
  }
  let accumulator=0;
  function down(key){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS'].includes(key))keys.add(key);
    if(key==='Space'&&status==='playing'&&hero.onGround){
      hero.vy=jump;hero.onGround=false;hero.climbing=false;
    }
  }
  addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
    if(e.repeat&&e.code==='Space')return;
    down(e.code)
  });
  addEventListener('keyup',e=>keys.delete(e.code));
  addEventListener('blur',()=>keys.clear());
  document.querySelectorAll('[data-key]').forEach(btn=>{
    const key=btn.dataset.key;
    btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);down(key)});
    btn.addEventListener('pointerup',()=>keys.delete(key));
    btn.addEventListener('pointercancel',()=>keys.delete(key));
    btn.addEventListener('lostpointercapture',()=>keys.delete(key));
  });
  document.getElementById('restart').addEventListener('click',reset);
  reset();requestAnimationFrame(frame);
})();
</script>
</body></html>
